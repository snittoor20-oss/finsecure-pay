# Server
server.port=8080
spring.application.name=finsecure-pay

# Actuator - expose health and prometheus endpoints
management.endpoints.web.base-path=/
management.endpoints.web.exposure.include=health,prometheus,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Custom application config (injected via ConfigMap in Kubernetes)
app.max.amount=10000
app.min.amount=0.01
app.supported.currencies=SGD,USD,EUR,GBP

# Logging
logging.level.com.finsecure=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n