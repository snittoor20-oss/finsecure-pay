apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsecure-pay
  namespace: default
  labels:
    app: finsecure-pay
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finsecure-pay
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: finsecure-pay
    spec:
      containers:
        - name: finsecure-pay
          image: yourdockerhubusername/finsecure-pay:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: finsecure-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: finsecure-secrets
                  key: DB_PASSWORD
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
            failureThreshold: 3