apiVersion: apps/v1
kind: Deployment
metadata:
  name: finsecure-pay
  namespace: default
  labels:
    app: finsecure-pay
    version: "1.0.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finsecure-pay
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app: finsecure-pay
        version: "1.0.0"
    spec:
      containers:
        - name: finsecure-pay
          image: dskn123/finsecure-pay:1.0.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
            - containerPort: 8081
              name: metrics

          # Inject ConfigMap values as environment variables
          envFrom:
            - configMapRef:
                name: finsecure-config

          # Inject individual secret values
          env:
            - name: APP_API_KEY
              valueFrom:
                secretKeyRef:
                  name: finsecure-secrets
                  key: api-key

          # Resource limits - important for cluster stability
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"

          # Readiness probe - Kubernetes only sends traffic
          # when this passes
          # Allow Spring Boot time to initialize
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 18
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          # Liveness probe - Kubernetes restarts the pod
          # if this fails
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 5
